<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptaVet - Relatórios de Resgate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/relatorios.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="navbar navbar-expand-lg navbar-dark bg-dark">
        <nav class="container" aria-label="Navegação Principal">
            <a class="navbar-brand" href="index.html">AdoptaVet</a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="form-animal.html">Cadastrar Animal</a></li>
                <li class="nav-item"><a class="nav-link active" href="relatorios.html">Relatórios</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5">
        <header class="mb-5 text-center text-md-start">
            <h1>Visão Geral dos Resgates</h1>
            <p class="text-muted">Indicadores chave gerados a partir do banco de dados.</p>
        </header>
        
        <section class="row text-center mb-5" aria-label="Métricas Principais">
            <article class="col-md-4 mb-3">
                <section class="card text-bg-primary h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h2 class="card-title h5">Total Resgatados</h2>
                        <p class="display-4 fw-bold mb-0" id="totalResgates">0</p>
                    </div>
                </section>
            </article>
            
            <article class="col-md-4 mb-3">
                <section class="card text-bg-success h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h2 class="card-title h5">Animais Adotados</h2>
                        <p class="display-4 fw-bold mb-0" id="totalAdotados">0</p>
                    </div>
                </section>
            </article>
            
            <article class="col-md-4 mb-3">
                <section class="card text-bg-warning h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h2 class="card-title h5 text-white">Em Tratamento</h2>
                        <p class="display-4 fw-bold text-white mb-0" id="totalTratamento">0</p>
                    </div>
                </section>
            </article>
        </section>

        <section class="card shadow-sm border-0" aria-label="Agenda e Eventos">
            <header class="card-header bg-white">
                <h2 class="h5 mb-0">Próximos Eventos de Adoção (Integração Futura)</h2>
            </header>
            <div class="card-body">
                <ul class="list-group list-group-flush" id="listaEventos">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Feira de Adoção na Praça Central
                        <time datetime="2026-11-15" class="badge bg-secondary rounded-pill">15/11/2026</time>
                    </li>
                </ul>
            </div>
        </section>
    </main>
    <script src="../assets/js/database.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
