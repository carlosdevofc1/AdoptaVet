<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptaVet - Cadastrar Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="navbar navbar-expand-lg navbar-dark bg-dark">
        <nav class="container" aria-label="Navegação Principal">
            <a class="navbar-brand" href="index.html">AdoptaVet</a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link active" href="form-animal.html">Cadastrar Animal</a></li>
                <li class="nav-item"><a class="nav-link" href="relatorios.html">Relatórios</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5">
        <article class="card shadow-sm mx-auto" style="max-width: 800px;">
            <header class="card-header bg-success text-white">
                <h2 class="h4 mb-0" id="tituloFormulario">Cadastrar Novo Animal</h2>
            </header>
            
            <section class="card-body">
                <form id="formAnimal">
                    <input type="hidden" id="animalId">
                    
                    <fieldset class="row mb-3 border-0 p-0 m-0">
                        <legend class="visually-hidden">Informações Básicas</legend>
                        <div class="col-md-6">
                            <label for="nomeAnimal" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nomeAnimal" required>
                        </div>
                        <div class="col-md-6">
                            <label for="especieAnimal" class="form-label">Espécie</label>
                            <select class="form-select" id="especieAnimal" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="Cachorro">Cachorro</option>
                                <option value="Gato">Gato</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </fieldset>

                    <fieldset class="row mb-3 border-0 p-0 m-0">
                        <legend class="visually-hidden">Características Físicas e Status</legend>
                        <div class="col-md-4">
                            <label for="racaAnimal" class="form-label">Raça (Pesquisar na API)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="racaAnimal">
                                <button class="btn btn-outline-secondary" type="button" id="btnBuscarRaca">Buscar</button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="idadeAnimal" class="form-label">Idade Estimada (Anos)</label>
                            <input type="number" class="form-control" id="idadeAnimal" step="0.1" min="0">
                        </div>
                        <div class="col-md-4">
                            <label for="statusAnimal" class="form-label">Status</label>
                            <select class="form-select" id="statusAnimal">
                                <option value="Em Tratamento">Em Tratamento</option>
                                <option value="Disponível">Disponível para Adoção</option>
                                <option value="Adotado">Adotado</option>
                            </select>
                        </div>
                    </fieldset>

                    <fieldset class="mb-3 border-0 p-0 m-0">
                        <legend class="visually-hidden">Mídia e Saúde</legend>
                        <div class="mb-3">
                            <label for="urlFoto" class="form-label">URL da Foto</label>
                            <input type="url" class="form-control" id="urlFoto" placeholder="https://exemplo.com/foto.jpg">
                        </div>
                        <div>
                            <label for="condicaoMedica" class="form-label">Condição Médica / Observações</label>
                            <textarea class="form-control" id="condicaoMedica" rows="3"></textarea>
                        </div>
                    </fieldset>

                    <footer class="d-flex justify-content-end gap-2 mt-4">
                        <a href="index.html" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success" id="btnSalvar">Salvar Dados</button>
                    </footer>
                </form>
            </section>
        </article>
    </main>
    <script src="../assets/js/database.js"></script>
    <script src="../assets/js/form.js"></script>
</body>
</html>
