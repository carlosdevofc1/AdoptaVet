<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptaVet - Animais Resgatados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/index.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <header class="navbar navbar-expand-lg navbar-dark bg-dark">
        <nav class="container" aria-label="Navegação Principal">
            <a class="navbar-brand" href="index.html">AdoptaVet</a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item"><a class="nav-link active" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="form-animal.html">Cadastrar Animal</a></li>
                <li class="nav-item"><a class="nav-link" href="relatorios.html">Relatórios</a></li>
            </ul>
        </nav>
    </header>

    
    <main class="container my-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h2>Animais no Abrigo</h2>
            <a href="form-animal.html" class="btn btn-success">+ Novo Resgate</a>
        </header>

        
        <search class="card mb-4 p-3 shadow-sm">
            <form class="row g-3" aria-label="Filtrar animais">
                <fieldset class="col-md-6 border-0 m-0 p-1">
                    <input type="search" id="inputPesquisa" class="form-control" placeholder="Pesquisar por nome ou raça..." aria-label="Buscar animal">
                </fieldset>
                <fieldset class="col-md-3 border-0 m-0 p-1">
                    <select id="filtroEspecie" class="form-select" aria-label="Filtrar por espécie">
                        <option value="">Todas as Espécies</option>
                        <option value="Cao">Cachorro</option>
                        <option value="Gato">Gato</option>
                    </select>
                </fieldset>
                <fieldset class="col-md-3 border-0 m-0 p-1">
                    <select id="ordenarIdade" class="form-select" aria-label="Ordenar por idade">
                        <option value="asc">Mais novos primeiro</option>
                        <option value="desc">Mais velhos primeiro</option>
                    </select>
                </fieldset>
            </form>
        </search>

        
        <section class="row" id="listaAnimais" aria-label="Lista de animais resgatados">
            
            <article class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <figure class="m-0">
                        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Foto do cachorro Rex">
                    </figure>
                    <section class="card-body">
                        <h3 class="card-title h5">Rex</h3>
                        <p class="card-text"><strong>Espécie:</strong> Cachorro <br> <strong>Raça:</strong> SRD</p>
                        <span class="badge bg-primary">Disponível</span>
                    </section>
                    <footer class="card-footer bg-white text-center border-top-0">
                        <a href="detalhes.html?id=1" class="btn btn-outline-primary btn-sm">Ver Detalhes</a>
                    </footer>
                </div>
            </article>
        </section>
    </main>
    <script src="../assets/js/database.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
